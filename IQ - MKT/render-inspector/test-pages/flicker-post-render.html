<!doctype html><meta charset="utf-8"><title>Post-render flicker fixture</title>
<style>html,body{margin:0;background:#191512}canvas{display:block;width:100px;height:100px}</style>
<canvas id="flicker-post-render" width="100" height="100"></canvas>
<script>
const canvas=document.getElementById('flicker-post-render'),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true});
const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}');
gl.shaderSource(fs,'precision mediump float;uniform vec4 uColor;void main(){gl_FragColor=uColor;}');
gl.compileShader(vs);gl.compileShader(fs);
const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
const color=gl.getUniformLocation(program,'uColor');gl.viewport(0,0,100,100);
const orange=[232,101,2],green=[81,168,93];let priorReferenceX=0;
const isOrange=value=>Math.abs(value[0]-orange[0])<3&&Math.abs(value[1]-orange[1])<3&&Math.abs(value[2]-orange[2])<3;
function renderPost(frame){
  const referenceX=Math.sin(frame/8)*20,targetX=priorReferenceX,trace=globalThis.__riFlickerTrace;
  gl.uniform4f(color,232/255,101/255,2/255,1);
  const draw=trace?.begin('WEBGL_DRAW',{canvasId:'flicker-post-render',incorrectStateVertices:3,motionDeltaPx:Math.abs(referenceX-targetX)});
  gl.drawArrays(gl.TRIANGLES,0,3);
  trace?.end('WEBGL_DRAW',draw,{canvasId:'flicker-post-render',incorrectStateVertices:3,motionDeltaPx:Math.abs(referenceX-targetX)});
  const override=trace?.begin('OUR_OVERRIDE',{canvasId:'flicker-post-render',phase:'post-render'});
  gl.uniform4f(color,81/255,168/255,93/255,1);
  trace?.end('OUR_OVERRIDE',override,{canvasId:'flicker-post-render',phase:'post-render',changed:true});
  trace?.record('ONE_FRAME_LATE',{canvasId:'flicker-post-render',motionDeltaPx:Math.abs(referenceX-targetX),referenceFrame:frame,targetFrame:frame-1});
  trace?.record('REFERENCE_TARGET_CLOCK_MISMATCH',{canvasId:'flicker-post-render',motionDeltaPx:Math.abs(referenceX-targetX)});
  priorReferenceX=referenceX;
}
globalThis.runFlickerBurst=count=>new Promise(resolve=>{
  const result={frames:0,orangeFrames:0};
  const next=()=>requestAnimationFrame(()=>{
    renderPost(result.frames);const pixel=new Uint8Array(4);gl.readPixels(50,50,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
    result.frames++;if(isOrange(pixel))result.orangeFrames++;
    if(result.frames>=count)resolve(result);else next();
  });next();
});
globalThis.fixtureReady=true;
</script>
