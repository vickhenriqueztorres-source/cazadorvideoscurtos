<!doctype html><meta charset="utf-8"><title>WebGL fixture</title><canvas id="target" width="320" height="240"></canvas>
<script>
const gl=target.getContext('webgl');const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');gl.shaderSource(fs,'precision mediump float;uniform vec4 uColor;void main(){gl_FragColor=uColor;}');gl.compileShader(vs);gl.compileShader(fs);
const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.8,-.8,.8,-.8,0,.8]),gl.STATIC_DRAW);
const p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);const color=gl.getUniformLocation(program,'uColor');gl.uniform4f(color,1,1,1,1);gl.viewport(0,0,320,240);gl.drawArrays(gl.TRIANGLES,0,3);
</script>
