[project]
name = "render-inspector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.10,<3",
  "websockets>=14,<16",
  "Pillow>=11,<13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["render_inspector"]
